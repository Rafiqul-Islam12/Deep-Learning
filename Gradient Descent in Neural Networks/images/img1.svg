<svg aria-label="Flowchart showing Input Layer to Hidden Layer to Output Layer, then Loss Function, Backpropagation, Gradient Descent, and Updated Weights with arrows connecting each step." data-d-component="svg" fill="currentColor" role="img" style="color:rgb(13, 13, 13)" viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#6B7280"/></marker></defs><rect width="320" height="260" rx="12" fill="#FFFFFF"/><rect x="78" y="18" width="164" height="24" rx="12" fill="#DBEAFE" stroke="#D1D5DB"/><text x="160" y="34" font-size="9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#111827">Input Layer</text><rect x="78" y="52" width="164" height="24" rx="12" fill="#E9D5FF" stroke="#D1D5DB"/><text x="160" y="68" font-size="9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#111827">Hidden Layer</text><rect x="78" y="86" width="164" height="24" rx="12" fill="#FCE7F3" stroke="#D1D5DB"/><text x="160" y="102" font-size="9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#111827">Output Layer</text><rect x="78" y="128" width="164" height="24" rx="12" fill="#FDE68A" stroke="#D1D5DB"/><text x="160" y="144" font-size="9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#111827">Loss Function</text><rect x="78" y="170" width="164" height="24" rx="12" fill="#FCA5A5" stroke="#D1D5DB"/><text x="160" y="186" font-size="9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#111827">Backpropagation</text><rect x="78" y="204" width="164" height="24" rx="12" fill="#A7F3D0" stroke="#D1D5DB"/><text x="160" y="220" font-size="9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#111827">Gradient Descent</text><line x1="160" y1="42" x2="160" y2="52" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="160" y1="76" x2="160" y2="86